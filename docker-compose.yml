version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: fotografo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fotografo
      POSTGRES_PASSWORD: fotografo_secret
      POSTGRES_DB: fotografo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fotografo']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fotografo-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://fotografo:fotografo_secret@postgres:5432/fotografo
      JWT_SECRET: dev-jwt-secret-change-in-production
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      CORS_ORIGINS: http://localhost:3000,http://localhost:8081
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fotografo-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_R2_HOSTNAME: ${NEXT_PUBLIC_R2_HOSTNAME}
    depends_on:
      - backend

volumes:
  postgres_data:
